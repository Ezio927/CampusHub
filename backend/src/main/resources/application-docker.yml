# ===========================================
# Docker 环境配置（连接 docker-compose 中的 MySQL + Redis）
# 使用方式：启动时指定 --spring.profiles.active=docker
# ===========================================

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/campushub?characterEncoding=utf8mb4&serverTimezone=Asia/Shanghai
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: ${DB_ROOT_PASSWORD:campushub123}
  jpa:
    hibernate:
      ddl-auto: validate       # 生产不自动改表结构，由 schema.sql 管理
    show-sql: false
  sql:
    init:
      mode: never              # MySQL 表结构由 docker-compose 启动时 schema.sql 初始化
  data:
    redis:
      host: localhost
      port: 6379

logging:
  level:
    com.example.backend: INFO
