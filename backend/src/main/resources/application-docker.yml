# ===========================================
# Docker 环境（MySQL + Redis）
# 启动: --spring.profiles.active=docker
# ===========================================

app:
  upload-dir: uploads

spring:
  servlet:
    multipart:
      max-file-size: 3MB
      max-request-size: 4MB
  datasource:
    url: jdbc:mysql://localhost:3307/campushub?characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: root123
  sql:
    init:
      mode: never

logging:
  level:
    com.example.backend: INFO
