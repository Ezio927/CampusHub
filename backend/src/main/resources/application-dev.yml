# ===========================================
# 开发环境配置（连接本地 MySQL）
# 使用方式：不改 application.yml 的 profile，IDE 启动默认 dev
# 前置条件：本地 MySQL 已建库 campushub
# ===========================================

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/campushub?characterEncoding=utf8mb4&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: ${DB_PASSWORD:root}
  jpa:
    hibernate:
      ddl-auto: update        # 开发阶段自动建表，实体变动自动同步
    show-sql: true

logging:
  level:
    com.example.backend: DEBUG
