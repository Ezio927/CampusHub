# ===========================================
# CampusHub 后端主配置文件
# ===========================================

spring:
  application:
    name: campushub
  profiles:
    active: docker
  jackson:
    date-format: yyyy-MM-dd'T'HH:mm:ss'Z'
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null
  servlet:
    multipart:
      max-file-size: 3MB
      max-request-size: 4MB

app:
  upload-dir: uploads
  rate-limit:
    demand-create:
      min-interval-seconds: 10
      max-per-hour: 10
      max-per-day: 30
    message-send:
      min-interval-seconds: 2
      max-per-hour: 120
      max-per-day: 500
    message-report:
      min-interval-seconds: 30
      max-per-hour: 5
      max-per-day: 10
    order-accept:
      min-interval-seconds: 5
      max-per-hour: 20
      max-per-day: 50
    arbitration-create:
      min-interval-seconds: 60
      max-per-hour: 3
      max-per-day: 5

server:
  port: 8080

# --- MyBatis-Plus ---
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto

# --- JWT ---
jwt:
  secret: ${JWT_SECRET:campushub-dev-secret-key-change-in-production}
  expiration-minutes: 60

# --- Swagger ---
springdoc:
  swagger-ui:
    path: /docs
  api-docs:
    path: /api-docs
