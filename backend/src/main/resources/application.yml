# ===========================================
# CampusHub 后端主配置文件
# 所有环境共享的配置写在这里
# 环境差异化配置写在 application-{profile}.yml
# ===========================================

spring:
  application:
    name: campushub
  profiles:
    active: dev     # 默认开发环境（H2 内存库）
  jackson:
    date-format: yyyy-MM-dd'T'HH:mm:ss'Z'
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

server:
  port: 8080

# --- JWT 配置 ---
jwt:
  secret: ${JWT_SECRET:campushub-dev-secret-key-change-in-production}
  expiration: 3600000   # 1 小时（毫秒）

# --- Swagger / OpenAPI ---
springdoc:
  swagger-ui:
    path: /docs
  api-docs:
    path: /api-docs
