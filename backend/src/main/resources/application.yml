# ===========================================
# CampusHub 后端主配置文件
# ===========================================

spring:
  application:
    name: campushub
  profiles:
    active: docker
  jackson:
    date-format: yyyy-MM-dd'T'HH:mm:ss'Z'
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null
  servlet:
    multipart:
      max-file-size: 3MB
      max-request-size: 4MB

app:
  upload-dir: uploads

server:
  port: 8080

# --- MyBatis-Plus ---
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto

# --- JWT ---
jwt:
  secret: ${JWT_SECRET:campushub-dev-secret-key-change-in-production}
  expiration-minutes: 60

# --- Swagger ---
springdoc:
  swagger-ui:
    path: /docs
  api-docs:
    path: /api-docs
