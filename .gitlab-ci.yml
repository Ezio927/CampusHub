stages:
  - build
  - test

# ========== 前端 ==========
frontend-build:
  stage: build
  image: node:20
  script:
    - cd frontend
    - npm install
    - npm run build

# ========== 后端 ==========
backend-compile:
  stage: build
  image: maven:3.9.9-eclipse-temurin-17
  script:
    - cd backend
    - mvn -B -DskipTests compile

backend-test:
  stage: test
  image: maven:3.9.9-eclipse-temurin-17
  script:
    - cd backend
    - mvn -B test
