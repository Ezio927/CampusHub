stages:
  - build
  - test

# ========== 前端 ==========
frontend-build:
  stage: build
  image: node:20-alpine
  script:
    - cd frontend
    - npm install
    - npm run build

# ========== 后端 ==========
backend-compile:
  stage: build
  script:
    - cd backend
    - mvn -B -DskipTests compile

backend-test:
  stage: test
  script:
    - cd backend
    - mvn -B test
