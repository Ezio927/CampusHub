stages:
  - build
  - test

frontend:
  stage: build
  image: node:20-alpine
  cache:
    key: node-modules
    paths:
      - frontend/node_modules
  script:
    - cd frontend
    - npm install
    - npm run build

backend:
  stage: test
  image: maven:3.9.9-eclipse-temurin-17
  cache:
    key: maven-repo
    paths:
      - .m2/repository
  script:
    - cd backend
    - mvn -B test -DfailIfNoTests=false -Dmaven.repo.local=../.m2/repository
