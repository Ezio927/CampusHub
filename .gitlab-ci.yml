stages:
  - build
  - test

frontend:
  stage: test
  image: node:20-alpine
  cache:
    key: node-modules
    paths:
      - frontend/node_modules
  script:
    - cd frontend
    - npm install
    - npm run build
    - npm run test:unit:run
  artifacts:
    when: always
    expire_in: 7 days
    paths:
      - frontend/dist/

backend:
  stage: test
  image: maven:3.9.9-eclipse-temurin-17
  cache:
    key: maven-repo-v2
    paths:
      - .m2/repository
  script:
    - cd backend
    - mvn -B test -Dmaven.repo.local=../.m2/repository
  artifacts:
    when: always
    expire_in: 7 days
    reports:
      junit:
        - backend/target/surefire-reports/TEST-*.xml
    paths:
      - backend/target/site/jacoco/
      - backend/target/surefire-reports/
